[project]
name = "reputation-topic-gpu"
version = "0.1.0"
description = "GPU-enabled reputation topic discovery and hot-topic detection"
readme = "README.md"
requires-python = ">=3.12,<3.13"

# Versions mirror the set the CPU prototype was validated against.
dependencies = [
    "pandas>=2.3,<3",
    "numpy>=2.1,<3",
    "scipy>=1.14,<2",
    "scikit-learn>=1.9,<2",
    "sentence-transformers>=5.0,<6",
    "transformers>=5.0,<6",
    "matplotlib>=3.9,<4",
    "umap-learn>=0.5.7,<0.6",
    "numba>=0.61",
    "hf-xet>=1.0",
    # NVML bindings: lets --max-vram-gb measure the whole process footprint
    # (what nvidia-smi shows), not just torch's allocator. Pure Python.
    "nvidia-ml-py>=12",
]

# Exactly one of these picks the CUDA build of torch. They are mutually
# exclusive (see tool.uv.conflicts). With none selected, torch comes from
# PyPI, which today ships the CUDA 13 build.
#
#   cu130  driver >= 580  (Blackwell, Hopper, Ada, Ampere)
#   cu126  driver >= 560  (older cloud images still on CUDA 12.x)
#   cpu    no GPU, for a local sanity run
[project.optional-dependencies]
cu130 = ["torch>=2.14,<3"]
cu126 = ["torch>=2.14,<3"]
cpu = ["torch>=2.14,<3"]
# The web dashboard (dashboard/server.py): starts runs and serves analytics.
# Independent of the torch extra -- combine it with any one of them.
dashboard = ["fastapi>=0.115", "uvicorn>=0.30"]

[tool.uv]
# Flat scripts, not an installable package -- do not try to build a wheel of it.
package = false
conflicts = [
    [{ extra = "cu130" }, { extra = "cu126" }, { extra = "cpu" }],
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", extra = "cu130" },
    { index = "pytorch-cu126", extra = "cu126" },
    { index = "pytorch-cpu", extra = "cpu" },
]
